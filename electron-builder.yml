appId: dev.datapilot.app
productName: DataPilot
copyright: Copyright © 2026 DataPilot

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

extraResources:
  # docker-compose.yml is read at runtime by dockerOrchestrator.ts to discover
  # service definitions. Placed at process.resourcesPath/docker-compose.yml.
  - from: docker-compose.yml
    to: docker-compose.yml

asar: true

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - universal
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  icon: build/icon.icns

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  category: Development
  target:
    - target: AppImage
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
