appId: dev.datapilot.app
productName: DataPilot
copyright: Copyright © 2026 DataPilot

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

extraResources:
  # Sample bags shipped with the installer (Phase 12 "Load demo bag" flow).
  - from: sample_bags
    to: sample_bags
    filter: ["**/*"]
  # docker-compose.yml is read at runtime by dockerOrchestrator.ts to discover
  # service definitions. Placed at process.resourcesPath/docker-compose.yml.
  - from: docker-compose.yml
    to: docker-compose.yml

asar: true

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  category: Development
  target:
    - target: AppImage
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
