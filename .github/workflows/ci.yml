name: CI

# Runs the test gates on every pull request and on every push to main.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — typecheck + Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

  backend:
    name: Backend — pytest + golden eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra ai --extra dev

      - name: Provide libprotobuf.so.23 for the vendored mcap DuckDB extension
        # The Linux mcap.duckdb_extension (query_mcap tool) dynamically links
        # libprotobuf.so.23 (protobuf 3.12, Ubuntu jammy soname), which the
        # runner doesn't ship. Graft it from the jammy .deb with a pinned
        # sha256 — identical to the approach in backend/Dockerfile.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends liblz4-1 curl ca-certificates
          curl -fsSL https://archive.ubuntu.com/ubuntu/pool/main/p/protobuf/libprotobuf23_3.12.4-1ubuntu7_amd64.deb -o /tmp/libprotobuf23.deb
          echo "8c9942e9130ab7c343438b1b81603bdd86509d7e2a9cc877ae35a998dbf5e0a8  /tmp/libprotobuf23.deb" | sha256sum -c -
          dpkg-deb -x /tmp/libprotobuf23.deb /tmp/pb
          sudo cp -a /tmp/pb/usr/lib/*/libprotobuf.so.23* /usr/lib/
          sudo ldconfig

      - name: Unit tests (pytest)
        # Default addopts deselect the eval/live markers, so this is the unit suite.
        run: uv run pytest -q

      - name: Golden eval (mock mode)
        # Citation-grounding / trajectory harness; runs without a provider key.
        run: uv run pytest tests/eval -q -m eval
