[project]
name = "datapilot-backend"
version = "0.1.0"
description = "DataPilot FastAPI + LangGraph backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0",  # SQLAlchemy async transient — pinned so `uv sync` keeps it
    "mcp>=1.0.0",     # Phase 5: MCP SDK for worker servers and client transport
    "httpx>=0.27.0",
    "python-multipart>=0.0.17",
    "neo4j>=5.27.0",
    "mcap>=1.2.1",
    "mcap-ros2-support>=0.5.5",
    "rosbags>=0.10.7",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "anthropic>=0.40.0",
    "openai>=1.55.0",
    "google-generativeai>=0.8.3",
    "sentence-transformers>=3.3.1",
    "pyyaml>=6.0.2",
    "sse-starlette>=2.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Default `pytest` excludes the eval/live cases — they're opt-in via `pytest -m eval`
# (or via the root `pnpm eval` script). Live cases require LIVE_LLM=1 + a provider key.
addopts = "-m 'not eval and not live'"
markers = [
    "eval: golden + trajectory + determinism harness (run via `pnpm eval` or `pytest -m eval`)",
    "live: requires LIVE_LLM=1 and a real provider key",
]
