# DataPilot local stack.
#
# This file is consumed by the Electron main process (`dockerOrchestrator.ts`,
# Phase 1) to discover image names, ports, and mount paths. It is NOT intended
# to be invoked manually with `docker compose up`. The desktop app boots and
# tears down this stack on launch / quit.
#
# All images are pulled from GitHub Container Registry (GHCR). To build from
# source instead, layer the dev override:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up --build
#
# Run `docker compose config` to validate this file.

name: datapilot

networks:
  datapilot-net:
    driver: bridge

volumes:
  neo4j-data:
  neo4j-logs:
  app-data:

services:
  neo4j:
    image: neo4j:5-community
    container_name: datapilot-neo4j
    networks: [datapilot-net]
    ports:
      - "7474:7474" # HTTP (Browser + health)
      - "7687:7687" # Bolt (driver)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-datapilot-local}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_bolt_telemetry_enabled: "false"
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      # neo4j:5-community doesn't ship wget; use bash's /dev/tcp to probe the port.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/7474' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: ghcr.io/rahulkatiyar19955/datapilot-backend:latest
    container_name: datapilot-backend
    networks: [datapilot-net]
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-datapilot-local}
      DATAPILOT_HOST_MOUNT: /host
      DATAPILOT_DATA_DIR: /data
    volumes:
      - app-data:/data
      # `/host` mount is injected at runtime by the Electron orchestrator —
      # it binds the user's home directory so the parser can read rosbags
      # by absolute host path without copying them.
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12

  mcap-parser:
    image: ghcr.io/rahulkatiyar19955/datapilot-mcap-parser:latest
    container_name: datapilot-mcap-parser
    networks: [datapilot-net]
    ports:
      - "8100:8100"
    environment:
      DATAPILOT_HOST_MOUNT: /host
    # `/host` mount injected by the Electron orchestrator at runtime (read-only).
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health', timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── MCP workers (Phase 5) ──────────────────────────────────────────────
  # All workers are pulled from GHCR. Each exposes a tiny HTTP `/health`
  # on a per-worker port that the backend's `/api/mcp/servers` route polls;
  # the primary MCP transport (stdio) is consumed by the backend via the
  # `mcp_stdio.WorkerHandle` pool when `DATAPILOT_MCP_TRANSPORT=stdio`
  # (the production default).
  rosbag-reader:
    image: ghcr.io/rahulkatiyar19955/datapilot-mcp-rosbag-reader:latest
    container_name: datapilot-rosbag-reader
    networks: [datapilot-net]
    ports:
      - "9001:9001"
    environment:
      DATAPILOT_HOST_MOUNT: /host
      ROSBAG_READER_HEALTH_PORT: "9001"
    # `/host` mount injected by the orchestrator at runtime (read-only).
    depends_on:
      backend:
        condition: service_started
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9001/health', timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12

  trajectory-analyzer:
    image: ghcr.io/rahulkatiyar19955/datapilot-mcp-trajectory-analyzer:latest
    container_name: datapilot-trajectory-analyzer
    networks: [datapilot-net]
    ports:
      - "9002:9002"
    environment:
      DATAPILOT_HOST_MOUNT: /host
      TRAJECTORY_ANALYZER_HEALTH_PORT: "9002"
    depends_on:
      backend:
        condition: service_started
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9002/health', timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12

  planner-failure-inspector:
    image: ghcr.io/rahulkatiyar19955/datapilot-mcp-planner-failure-inspector:latest
    container_name: datapilot-planner-failure-inspector
    networks: [datapilot-net]
    ports:
      - "9003:9003"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-datapilot-local}
      PLANNER_FAILURE_INSPECTOR_HEALTH_PORT: "9003"
    depends_on:
      neo4j:
        condition: service_healthy
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9003/health', timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12

  anomaly-detector:
    image: ghcr.io/rahulkatiyar19955/datapilot-mcp-anomaly-detector:latest
    container_name: datapilot-anomaly-detector
    networks: [datapilot-net]
    ports:
      - "9004:9004"
    environment:
      DATAPILOT_HOST_MOUNT: /host
      ANOMALY_DETECTOR_HEALTH_PORT: "9004"
    depends_on:
      backend:
        condition: service_started
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9004/health', timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12

  report-composer:
    image: ghcr.io/rahulkatiyar19955/datapilot-mcp-report-composer:latest
    container_name: datapilot-report-composer
    networks: [datapilot-net]
    ports:
      - "9005:9005"
    environment:
      REPORT_COMPOSER_HEALTH_PORT: "9005"
    depends_on:
      backend:
        condition: service_started
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9005/health', timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12
