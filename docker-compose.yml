# DataPilot local stack.
#
# This file is consumed by the Electron main process (`dockerOrchestrator.ts`,
# Phase 1) to discover image names, ports, and mount paths. It is NOT intended
# to be invoked manually with `docker compose up`. The desktop app boots and
# tears down this stack on launch / quit.
#
# Run `docker compose config` to validate this file.

name: datapilot

networks:
  datapilot-net:
    driver: bridge

volumes:
  neo4j-data:
  neo4j-logs:
  app-data:

services:
  neo4j:
    image: neo4j:5-community
    container_name: datapilot-neo4j
    networks: [datapilot-net]
    ports:
      - "7474:7474" # HTTP (Browser + health)
      - "7687:7687" # Bolt (driver)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-datapilot-local}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_bolt_telemetry_enabled: "false"
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      # neo4j:5-community doesn't ship wget; use bash's /dev/tcp to probe the port.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/7474' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: datapilot/backend:local
    container_name: datapilot-backend
    networks: [datapilot-net]
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-datapilot-local}
      DATAPILOT_HOST_MOUNT: /host
      DATAPILOT_DATA_DIR: /data
    volumes:
      - app-data:/data
      # `/host` mount is injected at runtime by the Electron orchestrator —
      # it binds the user's home directory so the parser can read rosbags
      # by absolute host path without copying them.
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── MCP workers (Phase 5) ──────────────────────────────────────────────
  # All workers share one build pattern: context is the repo root so the
  # image can pull in `backend/` (for `app.agent.tools.*`) + `mcp_workers/`
  # (for `_shared/` helpers + the worker package itself). Each exposes a
  # tiny HTTP `/health` on a per-worker port that the backend's
  # `/api/mcp/servers` route polls; the primary MCP transport (stdio) is
  # consumed by the backend via the `mcp_stdio.WorkerHandle` pool when
  # `DATAPILOT_MCP_TRANSPORT=stdio` (the production default).
  rosbag-reader:
    build:
      context: .
      dockerfile: mcp_workers/rosbag_reader/Dockerfile
    image: datapilot/mcp-rosbag-reader:local
    container_name: datapilot-rosbag-reader
    networks: [datapilot-net]
    ports:
      - "9001:9001"
    environment:
      DATAPILOT_HOST_MOUNT: /host
      ROSBAG_READER_HEALTH_PORT: "9001"
    # `/host` mount injected by the orchestrator at runtime (read-only).
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9001/health', timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12

  trajectory-analyzer:
    build:
      context: .
      dockerfile: mcp_workers/trajectory_analyzer/Dockerfile
    image: datapilot/mcp-trajectory-analyzer:local
    container_name: datapilot-trajectory-analyzer
    networks: [datapilot-net]
    ports:
      - "9002:9002"
    environment:
      DATAPILOT_HOST_MOUNT: /host
      TRAJECTORY_ANALYZER_HEALTH_PORT: "9002"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9002/health', timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12

  planner-failure-inspector:
    build:
      context: .
      dockerfile: mcp_workers/planner_failure_inspector/Dockerfile
    image: datapilot/mcp-planner-failure-inspector:local
    container_name: datapilot-planner-failure-inspector
    networks: [datapilot-net]
    ports:
      - "9003:9003"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-datapilot-local}
      PLANNER_FAILURE_INSPECTOR_HEALTH_PORT: "9003"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9003/health', timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12

  anomaly-detector:
    build:
      context: .
      dockerfile: mcp_workers/anomaly_detector/Dockerfile
    image: datapilot/mcp-anomaly-detector:local
    container_name: datapilot-anomaly-detector
    networks: [datapilot-net]
    ports:
      - "9004:9004"
    environment:
      DATAPILOT_HOST_MOUNT: /host
      ANOMALY_DETECTOR_HEALTH_PORT: "9004"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9004/health', timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12

  report-composer:
    build:
      context: .
      dockerfile: mcp_workers/report_composer/Dockerfile
    image: datapilot/mcp-report-composer:local
    container_name: datapilot-report-composer
    networks: [datapilot-net]
    ports:
      - "9005:9005"
    environment:
      REPORT_COMPOSER_HEALTH_PORT: "9005"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9005/health', timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12
